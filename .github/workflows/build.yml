name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Ensure debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l "$HOME/.android/debug.keystore"

      - name: Build APKs
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Sign with apksigner (force)
        run: |
          SDK="$ANDROID_SDK_ROOT"
          [ -z "$SDK" ] && SDK="$ANDROID_HOME"
          echo "SDK=$SDK"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort -r | head -1)
          echo "apksigner=$APKSIGNER"
          mkdir -p out
          for f in $(find app/build/outputs/apk -name "*.apk"); do
            base=$(basename "$f")
            cp "$f" "out/$base"
            "$APKSIGNER" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              "out/$base" || echo "sign skipped for $base"
            "$APKSIGNER" verify --print-certs "out/$base" || true
          done
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kwai-clean-apk
          path: out/*.apk
          if-no-files-found: error
